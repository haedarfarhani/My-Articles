<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>۴۰۴ — صفحه پیدا نشد | حیدر فرحانی</title>
  <meta name="description" content="صفحه‌ای که به دنبال آن هستید پیدا نشد؛ از فهرست مقالات، پروژه‌ها و کتابخانه‌ها استفاده کنید.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="googlebot" content="noindex, nofollow">
  <meta name="theme-color" content="#0F766E">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%230F766E'/><text x='50' y='70' font-size='56' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>ح</text></svg>">
  <script>
    try {
      var t = localStorage.getItem('hf_theme');
      if (t !== 'light' && t !== 'dark') {
        t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
  <script>
    // Base path detector: works at /My-Articles/ (GitHub Pages project),
    // at / (user site or custom domain) and when opened as a local file.
    (function () {
      var p = location.pathname;
      var base = '/';
      if (location.protocol === 'file:') base = p.replace(/404\.html$/, '');
      else if (p.indexOf('/My-Articles/') === 0) base = '/My-Articles/';
      else if (/404(\.html)?$/.test(p)) base = p.replace(/404(\.html)?$/, '');
      window.__siteBase = base;
      document.write('<link rel="stylesheet" href="' + base + 'css/fonts.css">');
      document.write('<link rel="stylesheet" href="' + base + 'css/tokens.css">');
      document.write('<link rel="stylesheet" href="' + base + 'css/base.css">');
      document.write('<link rel="stylesheet" href="' + base + 'css/responsive.css">');
    })();
  </script>
  <style>
    body { min-height: 100vh; display: grid; place-items: center; padding: 3rem 1.25rem; }
    .nf { max-width: 34rem; text-align: center; }
    .nf-code {
      font-size: clamp(4.5rem, 16vw, 8rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.04em;
      color: var(--color-primary, #0F766E);
      background: linear-gradient(180deg, var(--color-primary, #0F766E), var(--color-primary-light, #14B8A6));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .nf h1 { font-size: clamp(1.4rem, 4vw, 1.9rem); margin: 0.75rem 0 0.5rem; }
    .nf p { color: var(--text-muted, #64748B); line-height: 1.9; margin: 0 auto 1.75rem; }
    .nf-links { display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: center; }
    .nf-links a {
      display: inline-flex; align-items: center; gap: 0.4rem;
      padding: 0.7rem 1.3rem; border-radius: 999px; text-decoration: none;
      font-weight: 600; font-size: 0.95rem;
      background: var(--color-primary, #0F766E); color: #fff;
      transition: transform 0.2s ease, background 0.2s ease;
    }
    .nf-links a.ghost {
      background: var(--color-primary-soft, #F0FDFA);
      color: var(--color-primary, #0F766E);
      border: 1px solid var(--color-primary-soft, #F0FDFA);
    }
    .nf-links a:hover { transform: translateY(-2px); background: var(--color-primary-light, #14B8A6); color: #fff; }
    .nf-brand { display: inline-flex; align-items: center; gap: 0.6rem; font-weight: 700; color: var(--text-main, #1E293B); text-decoration: none; margin-bottom: 1.5rem; }
    .nf-brand span.badge {
      width: 2.4rem; height: 2.4rem; display: grid; place-items: center;
      border-radius: 0.75rem; background: var(--color-primary, #0F766E); color: #fff;
    }
  </style>
</head>
<body>
  <main class="nf">
    <a class="nf-brand" data-path="" href="/My-Articles/"><span class="badge">ح</span><span>حیدر فرحانی</span></a>
    <div class="nf-code">۴۰۴</div>
    <h1>صفحه‌ای که دنبالش بودید پیدا نشد</h1>
    <p>ممکن است آدرس را اشتباه وارد کرده باشید یا این صفحه جابه‌جا شده باشد. از فهرست زیر شروع کنید.</p>
    <div class="nf-links">
      <a data-path="" href="/My-Articles/">خانه</a>
      <a data-path="articles/" href="/My-Articles/articles/">مقالات</a>
      <a data-path="projects/" href="/My-Articles/projects/">پروژه‌ها</a>
      <a class="ghost" data-path="libraries/" href="/My-Articles/libraries/">کتابخانه‌ها</a>
      <a class="ghost" data-path="about/" href="/My-Articles/about/">درباره من</a>
      <a class="ghost" data-path="contact/" href="/My-Articles/contact/">تماس</a>
    </div>
  </main>

  <script>
    // Rewrite links so they work both at the GitHub Pages project base
    // (/My-Articles/) and at a custom domain / user site root (/).
    (function () {
      var base = window.__siteBase || '/';
      document.querySelectorAll('[data-path]').forEach(function (a) {
        a.setAttribute('href', base + a.getAttribute('data-path'));
      });
    })();
  </script>
</body>
</html>
